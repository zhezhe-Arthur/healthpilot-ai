
spring:
  application:
    name: healthpilot-server

  # MySQL 数据库连接
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/healthpilot_db}
    username: ${DB_USERNAME:healthpilot_app}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA 配置
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  # Flyway 数据库迁移
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret-base64: ${JWT_SECRET_BASE64}
  expiration-seconds: 86400