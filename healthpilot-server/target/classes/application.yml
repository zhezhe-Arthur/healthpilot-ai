
spring:
  application:
    name: healthpilot-server

  # MySQL 数据库连接
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/healthpilot_db}
    username: ${DB_USERNAME:healthpilot_app}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA 配置
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  # Flyway 数据库迁移
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret-base64: ${JWT_SECRET_BASE64}
  # Access Token：15分钟
  expiration-seconds: 900
  # Refresh Token所在会话：7天
  refresh-expiration-seconds: 604800


security:
  login-guard:
    # 使用独立密钥生成邮箱和IP的不可直接识别标识
    key-base64: ${LOGIN_GUARD_KEY_BASE64}

    # 同一IP每分钟最多30次登录尝试
    ip-max-attempts: 30
    ip-window-seconds: 60

    # 同一邮箱15分钟内最多失败5次
    account-max-failures: 5
    account-window-seconds: 900

    # 账号临时锁定15分钟
    lock-seconds: 900
