
spring:
  application:
    name: healthpilot-server-test

  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/healthpilot_db}
    username: ${DB_USERNAME:healthpilot_app}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  # 仅用于自动化测试，不用于生产环境
  secret-base64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  expiration-seconds: 86400

server:
  port: ${SERVER_PORT:8080}
